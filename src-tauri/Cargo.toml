[package]
name = "ops-workbench"
version = "0.1.0"
description = "Modern SSH desktop operations tool"
edition = "2021"

[lib]
name = "ops_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mobile)'] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
