name: Release

# One workflow, end to end: version → tag → build → draft release.
#
# Why everything lives in a single workflow: a push made with `GITHUB_TOKEN`
# does **not** trigger other workflows. Bumping the version in one workflow and
# building in another would therefore never build the new tag, so the bump,
# the commit, the tag and the build all happen here.
#
# Two ways to run it:
#   * "Run workflow" → pick `patch` / `minor` / `major` (or an explicit tag)
#     → the version is computed, committed, tagged and built.
#   * push a `vX.Y.Z` tag → the version is taken from the tag and only built.
#
# The result is always a **draft** release: the updater reads
# `/releases/latest/download/latest.json`, and GitHub's `latest` ignores
# drafts, so nothing reaches users until a human publishes it.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "SemVer level (ignored when 'tag' is set)"
        required: false
        default: patch
        type: choice
        options: [patch, minor, major]
      tag:
        description: "Explicit tag to publish, e.g. v0.1.0 for a baseline. No version bump happens."
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  version:
    name: Resolve version
    runs-on: windows-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        # pnpm 版本唯一来源是 package.json 的 `packageManager`；在这里写
        # version: 会与之冲突，Action 会直接报错。

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Compute the version
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          explicit="${{ inputs.tag || '' }}"
          if [ -n "$explicit" ]; then
            # Baseline / re-publish: tag only, never touch the version files.
            case "$explicit" in v*) ;; *) echo "::error::tag must start with 'v'"; exit 1 ;; esac
            version="${explicit#v}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pnpm version:bump "${{ inputs.bump }}" | tee bump.log
            version="$(sed -n 's/^version=//p' bump.log | tail -n1)"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$version" ]; then echo "::error::could not resolve a version"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Refresh the lockfile
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          # The app package is private, so pnpm does not store its version in
          # the lockfile — but dependency changes must still be committed.
          pnpm install --lockfile-only
          if [ -n "$(git status --porcelain pnpm-lock.yaml)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Four files, one number; see scripts/check-versions.mjs.
      - name: Versions must agree
        run: node scripts/check-versions.mjs
        env:
          EXPECTED_VERSION: ${{ steps.resolve.outputs.version }}

      - name: Commit the version bump and create the tag
        if: github.event_name == 'workflow_dispatch' && inputs.tag == ''
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "::error::version bump produced no change — was this version already released?"
            exit 1
          fi
          git commit -m "chore(release): v${{ steps.resolve.outputs.version }}"
          git tag "v${{ steps.resolve.outputs.version }}"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "v${{ steps.resolve.outputs.version }}"

      # Re-publish path: the tag may already exist (fixing an old release's
      # updater manifest, for example) — never fail the run for that.
      - name: Create the tag without bumping
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.resolve.outputs.tag }}" || echo "tag already exists"
          git push origin "${{ steps.resolve.outputs.tag }}" || echo "tag already pushed"

      - name: Updater signing secret must be configured
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is empty."
            echo "::error::Add it under Settings -> Secrets and variables -> Actions."
            echo "::error::Never commit the private key — only the public key belongs in tauri.conf.json."
            exit 1
          fi
          if [ -z "$PASSWORD" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is empty."
            exit 1
          fi

  frontend:
    name: Frontend quality
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # pnpm 版本唯一来源是 package.json 的 `packageManager`；在这里写
        # version: 会与之冲突，Action 会直接报错。

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `pnpm build` runs `tsc && vite build`, so types are checked too.
      - name: Type check + build
        run: pnpm build

      - name: Frontend tests
        run: pnpm test

  backend:
    name: Rust quality
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      # Not `-D warnings`: existing code carries warnings we are not fixing in
      # this release; clippy errors still fail the job.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --all-targets

  build:
    name: Build ${{ matrix.platform }}
    needs: [version, frontend, backend]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Phase 1 ships one fully verified channel: Windows x86_64.
          - os: windows-latest
            platform: windows-x86_64
            args: --target x86_64-pc-windows-msvc
          # Extension points, intentionally disabled in P5.1:
          # - macOS needs a Developer ID signature + notarization before an
          #   updater artifact can be trusted; an unsigned .app is quarantined
          #   by Gatekeeper, so we must not publish it.
          # - Linux needs per-distro packaging verification (AppImage/DEB).
          # - os: macos-latest
          #   platform: macos-universal
          #   args: --target universal-apple-darwin
          # - os: ubuntu-22.04
          #   platform: linux-x86_64
          #   args: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        # pnpm 版本唯一来源是 package.json 的 `packageManager`；在这里写
        # version: 会与之冲突，Action 会直接报错。

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # Belt and braces: the built binary must carry the version we tagged.
      - name: Verify the built version
        run: node scripts/check-versions.mjs
        env:
          EXPECTED_VERSION: ${{ needs.version.outputs.version }}

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signature (minisign) — NOT Windows Authenticode. The private
          # key never leaves GitHub Secrets; only its public half is compiled
          # into the app via tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          tagName: v__VERSION__
          releaseName: "BLS-OPS v__VERSION__"
          releaseDraft: true
          prerelease: false
          # Generates latest.json next to the installers — the file the running
          # app reads from /releases/latest/download/.
          uploadUpdaterJson: true
          # NSIS (setup.exe) is the recommended Windows update target and is
          # what `installMode: passive` was chosen for.
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          retryAttempts: 1
          args: ${{ matrix.args }}

      # tauri-action writes `api.github.com/.../releases/assets/<id>` URLs into
      # latest.json. That endpoint serves *metadata* (401 anonymously), not the
      # installer — the updater's download step would always fail. Rewrite the
      # URLs to browser-downloadable `releases/download/<tag>/<file>` links.
      - name: Rewrite updater manifest URLs to direct downloads
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern 'latest.json' --output latest.json
          ASSET_MAP="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq 'map({(.id|tostring): .name}) | add')"
          export ASSET_MAP
          node scripts/rewrite-updater-urls.mjs latest.json
          gh release upload "$TAG" latest.json --clobber
