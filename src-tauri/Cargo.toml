[package]
name = "ops-workbench"
version = "0.1.5"
description = "Modern SSH desktop operations tool"
edition = "2021"

[lib]
name = "ops_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
encoding_rs = "0.8.35"
keyring = "4.1.6"
notify = "7"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
russh = "0.63.1"
russh-sftp = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
# Updater/process versions are pinned with `=` on purpose: the JS packages in
# package.json carry the exact same numbers, and a drift between the two sides
# of the IPC boundary is a runtime failure. `scripts/check-versions.mjs`
# enforces the pair.
tauri-plugin-process = "=2.3.1"
tauri-plugin-updater = "=2.11.0"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
rand = "0.10"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mobile)'] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
