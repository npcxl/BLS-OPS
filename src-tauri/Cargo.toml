[package]
name = "ops-workbench"
version = "0.1.26"
description = "Modern SSH desktop operations tool"
edition = "2021"

[lib]
name = "ops_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
encoding_rs = "0.8.35"
keyring = "4.1.6"
notify = "7"
# 高性能数据库工作台（第二阶段）：原生 MySQL 协议驱动。
#
# * 选 `mysql_async` 而不是 `sqlx`：前者提供**运行时文本协议**（`query_iter`）
#   与逐行 `stream`，多结果集、affected_rows、连接 id 都是一等公民；
#   `sqlx::query()` 也能动态查询，但多结果集与流式取消没有这么直接。
# * 只启用 rustls（ring provider）：项目其余部分已经用 rustls，不引入 OpenSSL。
#   `default-rustls-ring` = derive + rust_backend + rustls-tls + tls12 + ring，
#   不启用 native-tls，也没有任何“默认不验证证书”的开关。
# * 绝不用 `sqlx::query!` 这类编译期宏：本工具连接的是用户自己的库，
#   构建期没有、也不应该有那个库的连接串。
mysql_async = { version = "0.37", default-features = false, features = [
    "default-rustls-ring",
] }
# PostgreSQL：走 **simple query（文本协议）**。
#
# * 选文本协议而不是二进制：`bigint` / `numeric` 拿到的是服务器原始字符串，
#   不需要额外类型 feature 就能保持精度（避免 f64/整数溢出）。
# * SQL 编辑器走 `query_raw` 流式读取（行/字节/单元格/时间预算都在流上执行）；
#   `simple_query` 只用于元数据、DDL 与导出的分页读取。
# * 流式路径需要按列类型解码：numeric 用 rust_decimal（保持精确字符串）、
#   时间类型用 chrono、json 用 serde_json。
# * TLS 尚未接入（需要 tokio-postgres-rustls）：当前只支持 `tls_mode = disabled`，
#   其它模式明确拒绝，不做"静默降级到明文"。
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
# Redis 引擎：与 MySQL 管线平行的键值驱动。
# * `tokio-comp` / `connection-manager`：async 连接管理（自动重连）。
# * `tokio-rustls-comp`：async TLS 走 rustls —— 与项目其余部分一致，
#   不引入 native-tls/OpenSSL。
# * `cluster-async` / `sentinel`：cluster 与哨兵两种拓扑。
redis = { version = "0.27", default-features = false, features = [
    "tokio-comp",
    "connection-manager",
    "tokio-rustls-comp",
    "cluster-async",
    "sentinel",
] }
# 查询结果以 `TryStream` 拉取，用 `next()` 逐行推进 —— 这是背压的基础。
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# 显式安装 rustls provider：同一进程里 reqwest 与 mysql_async 都会用 rustls，
# 没有进程级默认 provider 时 rustls 会在第一次握手 panic。
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# P5.1 制品导入：只用这四个，且都只做"读"。
# * `sha2`   —— 内容指纹（Artifact 与内容哈希绑定，文件一变分析就失效）。
# * `zip`    —— 读 ZIP 中央目录 + 按需读单个条目；`default-features = false`
#   关掉了 bzip2/zstd/aes 等一堆用不到的解码器，只留 deflate。
# * `tar`/`flate2` —— 读 .tar 与 .tar.gz 的条目头。
# 绝不用它们**解压到磁盘**：所有读取都是流式的，带字节上限
# （见 `deployment::artifact::limits`）。
flate2 = "1"
# P5.5 部署方案 AI 复核：唯一的 HTTP 客户端。
#  
# * 只用 `default-tls`（= rustls）与 `json`：**不启用** gzip/cookies/multipart
#   等本项目用不到的能力（少一个能力就少一处攻击面）。
# * 版本与 `Cargo.lock` 里已有的 reqwest 一致（tauri 的 updater 已经用它），
#   因此不需要下载新的 crate 树。

reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "charset",
    "http2",
    "default-tls",
] }

rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
russh = "0.63.1"
russh-sftp = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
# `unstable`：启用 `WebviewWindow::set_effects`（Windows Acrylic 毛玻璃）。
# CSS 的 `backdrop-filter` 模糊不了窗口背后的桌面，真正的磨砂只能交给 DWM。
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.5.5"
# Updater/process versions are pinned with `=` on purpose: the JS packages in
# package.json carry the exact same numbers, and a drift between the two sides
# of the IPC boundary is a runtime failure. `scripts/check-versions.mjs`
# enforces the pair.
tauri-plugin-process = "=2.3.1"
tauri-plugin-updater = "=2.11.0"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
rand = "0.10"

# 窗口材质判断只在 Windows 上需要：系统版本决定 Acrylic 是否可用，
# 注册表决定用户是否关掉了"透明效果"。两者都已是 tauri 的传递依赖，
# 这里显式声明是为了能在业务代码里直接引用（不额外下载 crate）。
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
windows-version = "0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mobile)'] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
