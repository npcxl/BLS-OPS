[package]
name = "ops-workbench"
version = "0.1.15"
description = "Modern SSH desktop operations tool"
edition = "2021"

[lib]
name = "ops_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
encoding_rs = "0.8.35"
keyring = "4.1.6"
notify = "7"
# P5.1 制品导入：只用这四个，且都只做"读"。
# * `sha2`   —— 内容指纹（Artifact 与内容哈希绑定，文件一变分析就失效）。
# * `zip`    —— 读 ZIP 中央目录 + 按需读单个条目；`default-features = false`
#   关掉了 bzip2/zstd/aes 等一堆用不到的解码器，只留 deflate。
# * `tar`/`flate2` —— 读 .tar 与 .tar.gz 的条目头。
# 绝不用它们**解压到磁盘**：所有读取都是流式的，带字节上限
# （见 `deployment::artifact::limits`）。
flate2 = "1"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
russh = "0.63.1"
russh-sftp = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2.5.5"
# Updater/process versions are pinned with `=` on purpose: the JS packages in
# package.json carry the exact same numbers, and a drift between the two sides
# of the IPC boundary is a runtime failure. `scripts/check-versions.mjs`
# enforces the pair.
tauri-plugin-process = "=2.3.1"
tauri-plugin-updater = "=2.11.0"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
rand = "0.10"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mobile)'] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
